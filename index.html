  <script>
    /* =====================================================================
       MODE FLAG  — switch rendering approach
         'static'  →  fetch /data/{slug}.json and render full HTML  (default)
         'iframe'  →  wrap 6ixgo.com contact page in iframe
    ===================================================================== */
    var MODE = 'static';

    var FE_ORIGIN = 'https://6ixgo.com';

    function getPathParts() {
      return window.location.pathname.replace(/^\/+|\/+$/g,'').split('/').filter(Boolean);
    }

    function esc(s) {
      return String(s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }

    var SVG_NOTI_SUCCESS='<svg fill="none" height="100%" viewBox="0 0 32 32" width="100%" xmlns="http://www.w3.org/2000/svg"><g clip-path="url(#nsc)"><path clip-rule="evenodd" d="M16 0.625L19.2284 3.95169L23.6875 2.68488L24.82 7.18006L29.3151 8.3125L28.0483 12.7717L31.375 16L28.0483 19.2284L29.3151 23.6875L24.8199 24.82L23.6875 29.3151L19.2283 28.0483L16 31.375L12.7716 28.0483L8.3125 29.3151L7.18 24.8199L2.68488 23.6875L3.95169 19.2283L0.625 16L3.95169 12.7716L2.68488 8.3125L7.18006 7.18L8.3125 2.68488L12.7717 3.95169L16 0.625Z" fill-rule="evenodd" stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="22.9256" stroke-width="1.5"/><path clip-rule="evenodd" d="M14.1237 16.826L20.6294 10.3203L23.0599 12.7507L14.1237 21.6869L8.9375 16.5008L11.3679 14.0703L14.1237 16.826Z" fill="white" fill-rule="evenodd"/></g><defs><clipPath id="nsc"><rect fill="white" height="100%" width="100%"/></clipPath></defs></svg>';
    var SVG_ALERT_X='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path clip-rule="evenodd" d="M7.28033 6.21967C6.98744 5.92678 6.51256 5.92678 6.21967 6.21967C5.92678 6.51256 5.92678 6.98744 6.21967 7.28033L10.9393 12L6.21967 16.7197C5.92678 17.0126 5.92678 17.4874 6.21967 17.7803C6.51256 18.0732 6.98744 18.0732 7.28033 17.7803L12 13.0607L16.7197 17.7803C17.0126 18.0732 17.4874 18.0732 17.7803 17.7803C18.0732 17.4874 18.0732 17.0126 17.7803 16.7197L13.0607 12L17.7803 7.28033C18.0732 6.98744 18.0732 6.51256 17.7803 6.21967C17.4874 5.92678 17.0126 5.92678 16.7197 6.21967L12 10.9393L7.28033 6.21967Z" fill="currentColor" fill-rule="evenodd"/></svg>';

    function doCopy(text, onDone) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(onDone).catch(function(){ legacyCopy(text, onDone); });
      } else { legacyCopy(text, onDone); }
    }
    function legacyCopy(text, onDone) {
      var ta=document.createElement('textarea');
      ta.value=text; ta.style.cssText='position:fixed;top:-9999px;left:-9999px;opacity:0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); onDone(); } catch(e){}
      document.body.removeChild(ta);
    }
    function copyText(text, desc) {
      doCopy(text, function(){
        showAlert('Success', desc || '\ud074\ub9bd\ubcf4\ub4dc\uc5d0 \ubcf5\uc0ac\ub418\uc5c8\uc2b5\ub2c8\ub2e4');
      });
    }
    function showAlert(title, desc) {
      var container=document.getElementById('alerts-container');
      var item=document.createElement('div');
      item.className='alert-item';
      item.innerHTML=
        '<div class="alert-icon">'+SVG_NOTI_SUCCESS+'</div>'
        +'<div class="alert-body">'
          +'<div class="alert-title">'+esc(title)+'</div>'
          +'<div class="alert-desc">'+esc(desc)+'</div>'
        +'</div>'
        +'<button class="alert-close" aria-label="\ub2eb\uae30">'+SVG_ALERT_X+'</button>'
        +'<div class="alert-progress"></div>';
      container.appendChild(item);
      item.querySelector('.alert-close').addEventListener('click', function(){ dismissAlert(item); });
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          item.classList.add('a-show');
          var bar=item.querySelector('.alert-progress');
          bar.style.transition='width 3000ms linear';
          bar.style.width='0%';
        });
      });
      var t=setTimeout(function(){ dismissAlert(item); }, 3000);
      item._t=t;
    }
    function dismissAlert(item) {
      clearTimeout(item._t);
      item.classList.remove('a-show');
      setTimeout(function(){ if(item.parentNode) item.parentNode.removeChild(item); }, 300);
    }
    function openSharePanel() {
      var url=window.location.href.split('?')[0];
      document.getElementById('sp-url-display').textContent=url;
      var overlay=document.getElementById('share-overlay');
      var panel=document.getElementById('share-panel');
      overlay.style.display='block';
      panel.style.display='block';
      if (window.innerWidth>=768) {
        var btn=document.getElementById('s-share-btn');
        if (btn) {
          var r=btn.getBoundingClientRect();
          var pw=380;
          var left=r.right-pw;
          if (left<16) left=16;
          if (left+pw>window.innerWidth-16) left=window.innerWidth-pw-16;
          panel.style.left=left+'px';
          panel.style.top=(r.bottom+8)+'px';
        }
      } else {
        panel.style.left=''; panel.style.top='';
        requestAnimationFrame(function(){
          requestAnimationFrame(function(){ panel.classList.add('mob-open'); });
        });
      }
    }
    function closeSharePanel() {
      var overlay=document.getElementById('share-overlay');
      var panel=document.getElementById('share-panel');
      if (window.innerWidth<768) {
        panel.classList.remove('mob-open');
        setTimeout(function(){ panel.style.display='none'; overlay.style.display='none'; }, 300);
      } else {
        panel.style.display='none'; overlay.style.display='none';
      }
    }
    function copyShareUrl() {
      doCopy(window.location.href.split('?')[0], function(){
        closeSharePanel();
        showAlert('Success', 'URL \ubcf5\uc0ac \uc131\uacf5');
      });
    }

    function processFields(fields) {
      var loc=null,pri=null,sec=[],kk=null;
      fields.forEach(function(f){
        if(f.field==='location'&&!loc) loc=f;
        else if(f.field==='phoneNumber'){ if(!pri) pri=f; else sec.push(f); }
        else if(f.field==='kakaoTalk'&&!kk) kk=f;
      });
      return {location:loc,primaryPhone:pri,secondaryPhones:sec,kakaoTalk:kk};
    }

    function splitAddr(addr) {
      var p=addr.split(',');
      if(p.length<3) return null;
      return {line1:p.slice(0,-2).join(',').trim(), line2:p.slice(-2).join(',').trim()};
    }

    function telNum(num) {
      /* Strip everything except digits and leading + (RFC 3966 tel: URI) */
      return String(num).replace(/[^\d+]/g, '');
    }

    function renderStatic(apiData) {
      var contact=apiData.data;
      var p=processFields(contact.detail.fields);
      var loc=p.location,pri=p.primaryPhone,sec=p.secondaryPhones,kk=p.kakaoTalk;
      var mapsUrl=loc?'https://www.google.com/maps/dir/?api=1&destination='+loc.lat+','+loc.lng:null;
      var al=loc?splitAddr(loc.value):null;

      var addrHtml='';
      if(loc){
        if(al){
          addrHtml='<span class="s-addr-line">'+esc(al.line1)+',</span>'
            +'<span class="s-addr-line-row"><span class="s-addr-line">'+esc(al.line2)+'</span>'
            +'<button class="s-copy-btn" data-copy="'+esc(loc.value)+'" aria-label="\uc8fc\uc18c \ubcf5\uc0ac">'+SVG_COPY+'</button></span>';
        } else {
          addrHtml='<span class="s-addr-line-row"><span class="s-addr-line">'+esc(loc.value)+'</span>'
            +'<button class="s-copy-btn" data-copy="'+esc(loc.value)+'" aria-label="\uc8fc\uc18c \ubcf5\uc0ac">'+SVG_COPY+'</button></span>';
        }
      }

      var secHtml=sec.map(function(ph){
        return '<div class="s-sec-wrap"><span class="s-or">\ub610\ub294</span>'
          +'<a class="s-sec-tel s-tel-link" href="tel:'+telNum(ph.value)+'" data-tel="'+telNum(ph.value)+'">'+esc(ph.value)+'</a></div>';
      }).join('');

      var phoneHtml=pri
        ?'<div class="s-phones">'
          +'<img class="s-icon" src="/assets/contact/icon-phone.svg" alt="" aria-hidden="true"/>'
          +'<p class="s-label-sm">문의</p>'
          +'<a class="s-call s-tel-link" href="tel:'+telNum(pri.value)+'" data-tel="'+telNum(pri.value)+'">'+esc(pri.value)+'&nbsp;\uc5f0\uacb0</a>'
          +secHtml+'</div>':'';

      var kakaoHtml=kk
        ?'<div class="s-kakao">'+SVG_KAKAO
          +'<div class="s-kakao-info"><p class="s-label-sm">KaKaoTalkID</p>'
          +'<div class="s-kakao-row"><span class="s-kakao-val">'+esc(kk.value)+'</span>'
          +'<button class="s-copy-btn" data-copy="'+esc(kk.value)+'" aria-label="\uce74\uce74\uc624\ud1a1 \uc544\uc774\ub514 \ubcf5\uc0ac">'+SVG_COPY+'</button>'
          +'</div></div></div>':'';

          +'<img class="s-map s-map-dt" src="/assets/contact/map-desktop.png" alt="'+esc(loc.value)+'" loading="lazy"/>'
          +(mapsUrl?'<a class="s-maps-link" href="'+esc(mapsUrl)+'" target="_blank" rel="noopener noreferrer">\uad6c\uae00 \uc9c0\ub3c4 \uc5d0\uc11c \ubcf4\uae30</a>':'')
          +'</div>':'';

        +'<div class="s-title-row s-z6">'
          +'<h1 class="s-title">'+esc(contact.detail.title)+'</h1>'
          +'<div class="s-share-wrap">'
            +'<button class="s-share-btn" id="s-share-btn" aria-label="\uacf5\uc720">'+SVG_SHARE+'</button>'
          +'</div>'
        +'</div>'
        +(loc?'<div class="s-section s-z5">'
          +'<img class="s-icon" src="/assets/contact/icon-map-pin.svg" alt="" aria-hidden="true"/>'

        +mapHtml

      var ogU=document.querySelector('meta[property="og:url"]');
      if(ogT) ogT.setAttribute('content',title);
      if(twT) twT.setAttribute('content',title);
      if(ogU) ogU.setAttribute('content',window.location.href.split('?')[0]);
    }

    function getEmbedUrl(slug,prefix) {
      var path=prefix.length?'/'+prefix.join('/')+'/contact/'+slug:'/contact/'+slug;
      return FE_ORIGIN+path+'?_shareUrl='+encodeURIComponent(window.location.origin+'/'+slug);
    }

    function applySlugTitle(slug) {
      var t=slug.replace(/[-_]/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase();})+' | 6ixgo';
      document.title=t;
      var ogT=document.querySelector('meta[property="og:title"]');
      var twT=document.querySelector('meta[name="twitter:title"]');
      var ogU=document.querySelector('meta[property="og:url"]');
      if(ogT) ogT.setAttribute('content',t);
      if(twT) twT.setAttribute('content',t);
      if(ogU) ogU.setAttribute('content',window.location.href.split('?')[0]);
    }

    (function initPanelListeners(){
      document.getElementById('share-overlay').addEventListener('click', closeSharePanel);
      document.getElementById('share-close-btn').addEventListener('click', closeSharePanel);
      document.getElementById('sp-copy-btn').addEventListener('click', copyShareUrl);
    })();

    (function boot() {
      var parts=getPathParts();
      var slug=parts.length?parts[parts.length-1]:null;
      var prefix=parts.slice(0,-1);
      if(!slug){ document.getElementById('not-found').style.display='block'; return; }
      applySlugTitle(slug);
      if(MODE==='static'){
        fetch('/data/'+slug+'.json',{cache:'no-store'})
          .then(function(r){ if(!r.ok) throw 0; return r.json(); })
          .then(function(d){ renderStatic(d); })
          .catch(function(){ document.getElementById('not-found').style.display='block'; });
      } else {
        var fr=document.getElementById('frame');
        fr.src=getEmbedUrl(slug,prefix); fr.style.display='block';
      }
    })();
</script>
