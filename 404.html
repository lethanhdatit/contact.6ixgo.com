<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <!-- OG tags for crawlers (non-JS): slug-based title derived from URL path -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="6ixgo" />
  <meta property="og:title" content="6ixgo Contact" />
  <meta property="og:description" content="6ixgo 연락처 정보" />
  <meta property="og:image" content="https://6ixgo.com/assets/contact/map-desktop.png" />
  <meta property="og:image:width" content="628" />
  <meta property="og:image:height" content="388" />
  <meta property="og:image:alt" content="6ixgo contact location map" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@6ixgo" />
  <meta name="twitter:title" content="6ixgo Contact" />
  <meta name="twitter:image" content="https://6ixgo.com/assets/contact/map-desktop.png" />
  <script>
    // Derive a human-readable title from the slug in the URL path.
    (function () {
      var parts = window.location.pathname.replace(/^\/+|\/+$/g, '').split('/').filter(Boolean);
      var slug = parts[parts.length - 1] || '';
      if (slug) {
        var title = slug.replace(/-/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); }) + ' | 6ixgo';
        document.querySelector('meta[property="og:title"]').setAttribute('content', title);
        document.querySelector('meta[name="twitter:title"]').setAttribute('content', title);
        document.querySelector('meta[property="og:url"]') &&
          document.querySelector('meta[property="og:url"]').setAttribute('content', window.location.href);
      }
      // GitHub Pages SPA trick: store the full URL then redirect to / where index.html restores it.
      sessionStorage.setItem('gh-pages-redirect', window.location.href);
      window.location.replace('/');
    })();
  </script>
</head>
<body></body>
</html>
